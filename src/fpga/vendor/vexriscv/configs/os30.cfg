# VexiiRiscv CPU config — Pocket os30 variant (Quake2 / SM64, 3D triangles).
#
# Sourced by generate_vexii.sh.  Same single-issue base as os25 plus the
# reduced-accuracy FMA (shorter FPU mantissa-compare cone; adopted after the
# 2026-07 equilibrium campaign — best-ever WNS/ALM on both axes).
# Output: VexiiRiscv/VexiiRiscv_os30.v

ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=1024         # 128 KB D$

EXTRA_FLAGS="--fma-reduced-accuracy"

# Same Pocket-tuned execute_freeze_valid hint as os25.
MAXFAN_HINT=16
