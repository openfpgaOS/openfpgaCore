# VexiiRiscv CPU config — Pocket os20 variant (2D games, DUAL ISSUE).
#
# Sourced by generate_vexii.sh.  Same dual-issue configuration MiSTer ships
# (--decoders=2 --lanes=2), brought to the Pocket for CPU-rendered 2D games
# (Diablo, ScummVM): the variant's GPU cuts (variants/os20.mk) free the ALMs
# the second issue lane costs.  First dual-issue attempt on the A4 / C8
# grade — the C8 is the slowest speed grade, so expect a tougher 100 MHz
# wall than single-issue os25 (−0.578) and sweep accordingly.
# Output: VexiiRiscv/VexiiRiscv_os20.v

# 32 KB I$ (keep fetch bandwidth — two decoders to feed); 64 KB D$
# (512 sets).  The full 128 KB D$ + dual issue does NOT fit the A4:
# first fit attempt (2026-07-09) ended 18,872/18,480 ALMs (102%) and
# 309/308 M10K.  Halving the D$ frees 64 M10K blocks (fixes the M10K
# wall outright) plus tag/bank-mux ALMs; 64 KB was the Pocket's shipped
# D$ size for most of the project's life.
ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=512          # 64 KB D$

# Predictor "free basket" (adopted 2026-07-13; 10-seed A/B at full timing
# parity — best −1.081 vs −1.109, median −1.64 vs −1.66 — for −4 M10K):
# GShare 4 KB → 1 KB and BTB 512 → 256 sets (the sizes generate_vexii.sh's
# header always documented), plus drop the Zicbop prefetch decode (zero
# prefetch.* emitters in firmware/musl; the encodings degrade to base-ISA
# NOPs on a non-Zicbop core regardless).
GSHARE_BYTES=1024
BTB_SETS=256
LSU_SW_PREFETCH=0

# Dual issue + the reduced-accuracy FMA os30 already ships (shrinks the
# shared FPU add/FMA mantissa cone — several hundred ALMs and the FPU
# timing cone with it).
#
# ⛔ Zba/Zbb REJECTED (A/B'd 2026-07-09, 50-seed sweeps both sides): adding
# --with-rvZba --with-rvZbb regressed the WHOLE timing distribution ~1.2 ns
# (best −1.109→−2.322, median −1.51→−2.66).  Mechanism: Zbb's rotate/clz/
# cpop/rev8 widen the early-ALU result mux, which sits INSIDE the mandatory
# full-bypass forwarding loop (--allow-bypass-from=0, non-negotiable for
# correctness) — and dual issue doubles that network's fan (the failing
# cone was lane-1's SrcPlugin operand forward).  Do not re-add blind.
# UNTRIED: Zba alone (3 fused shift-adds folded into the adder, no new
# result-mux source) — the cheap half of what the 2D blit loops want.
EXTRA_FLAGS="--decoders=2 --lanes=2 --fma-reduced-accuracy"

# Start CLEAN like mister: the maxfan=16 execute_freeze_valid hint was
# A/B-tuned against the SINGLE-issue A4/C8 netlist; mid-cone replication
# hints have repeatedly REGRESSED when applied untuned (see the notes in
# generate_vexii.sh).  Add a hint only after STA on the dual-issue fit
# demands one.
MAXFAN_HINT=0
