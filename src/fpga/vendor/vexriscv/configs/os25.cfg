# VexiiRiscv CPU config — Pocket os25 variant (2.5D games).
#
# Sourced by generate_vexii.sh.  This file is the ONLY place this variant's
# CPU configuration lives — add a new variant by dropping a sibling .cfg
# (see configs/README.md); no script edits needed.
#
# Single-issue, tuned against the Pocket's Cyclone V E A4 / C8 grade at
# 100 MHz.  Output: VexiiRiscv/VexiiRiscv_os25.v

# Cache geometry — (sets × 2 ways × 64 B line):
#   I$ sets:  256 = 32 KB,  128 = 16 KB
#   D$ sets: 1024 = 128 KB,  512 = 64 KB
ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=1024         # 128 KB D$

# Predictor "free basket" (adopted 2026-07-13; 10-seed A/B seeds 1-10):
# GShare 4 KB → 1 KB, BTB 512 → 256 sets, drop the Zicbop prefetch decode
# (zero prefetch.* emitters in firmware/musl; encodings degrade to NOPs).
# BEAT the control outright: best WNS −0.496 (seed 3) vs −0.578 (seed 6),
# TNS −12.0 vs −32.6, runner-up seed 8 −0.544 also over control-best —
# AND relieves the M10K wall: 304/308 vs 308/308.  os30 A/B'd the same
# basket and REGRESSED ~0.2 ns (best −1.309 vs −1.056) with no M10K need
# (283/308) — basket is os20/os25-only; os30 keeps full-size predictors.
GSHARE_BYTES=1024
BTB_SETS=256
LSU_SW_PREFETCH=0

# Extra vexiiriscv.Generate flags appended to the shared base config.
EXTRA_FLAGS=""

# maxfan annotation on execute_freeze_valid (0 = off).  A/B-tuned against
# the Pocket A4/C8 fitter — see the notes in generate_vexii.sh before
# changing; several other annotations were trialled and REGRESSED.
MAXFAN_HINT=16
