# VexiiRiscv CPU config — Pocket os25 variant (2.5D games).
#
# Sourced by generate_vexii.sh.  This file is the ONLY place this variant's
# CPU configuration lives — add a new variant by dropping a sibling .cfg
# (see configs/README.md); no script edits needed.
#
# Single-issue, tuned against the Pocket's Cyclone V E A4 / C8 grade at
# 100 MHz.  Output: VexiiRiscv/VexiiRiscv_os25.v

# Cache geometry — (sets × 2 ways × 64 B line):
#   I$ sets:  256 = 32 KB,  128 = 16 KB
#   D$ sets: 1024 = 128 KB,  512 = 64 KB
ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=1024         # 128 KB D$

# Predictor "free basket" (adopted 2026-07-13; 10-seed A/B seeds 1-10):
# GShare 4 KB → 1 KB, BTB 512 → 256 sets, drop the Zicbop prefetch decode
# (zero prefetch.* emitters in firmware/musl; encodings degrade to NOPs).
# BEAT the control outright: best WNS −0.496 (seed 3) vs −0.578 (seed 6),
# TNS −12.0 vs −32.6, runner-up seed 8 −0.544 also over control-best —
# AND relieves the M10K wall: 304/308 vs 308/308.  os30 A/B'd the same
# basket and REGRESSED ~0.2 ns (best −1.309 vs −1.056) with no M10K need
# (283/308) — basket is os20/os25-only; os30 keeps full-size predictors.
GSHARE_BYTES=1024
BTB_SETS=256
LSU_SW_PREFETCH=0

# Extra vexiiriscv.Generate flags appended to the shared base config.
EXTRA_FLAGS=""
DIV_RADIX=4

# maxfan annotation on execute_freeze_valid (0 = off).  A/B-tuned against
# the Pocket A4/C8 fitter — see the notes in generate_vexii.sh before
# changing; several other annotations were trialled and REGRESSED.
# The 2026-09-06 Pocket review retuned this hint after the GPU/fabric changes.
# This changes synthesis replication only; ISA and pipeline settings stay fixed.
MAXFAN_HINT=32

# Single-cycle shifts: drop --relaxed-shift, which spends an extra execute
# stage on every shift (adopted for os20 in ceeffcc). CPU stress + 7-kernel
# bench: 1,203,928 -> 1,113,345 cycles (-7.5%), digests unchanged. Over
# seeds 13-30 the mean setup slack is -0.901 ns against -0.875 ns before.
# Seed 28: setup -0.601 ns, worst hold +0.092 ns, 15,513 ALMs (2026-11-18).
# Timing is still NOT closed at 100 MHz.
RELAXED_SHIFT=0

# Front end, branch prediction and data-cache hazards (2026-11-20):
# - a one-entry buffer after the last fetch stage, so the late decode stall
#   lands on one register instead of every fetch stage's clock enable;
# - BTB redirect without --relaxed-btb / --relaxed-btb-hit, a dual-port BTB
#   so a predictor write no longer halts fetch, and learning of returns that
#   the return stack happened to predict;
# - return-stack pointers restored on a flush or trap;
# - refill/writeback hazards compared on the whole set index one stage early.
# CPU stress and interrupt stress pass; 7-kernel bench 1,113,345 -> 1,047,165
# cycles (-5.9%), digests unchanged. Fitted together with the GPU and SDRAM
# write-path switches in variants/os25.mk: over seeds 13-30 the mean setup
# slack is -1.017 ns. Seed 22: setup -0.431 ns, worst hold +0.099 ns,
# 15,782 ALMs, 300 of 308 M10K. Timing is still NOT closed at 100 MHz.
OS25_FRONTEND_LSU=1
RELAXED_BTB=0
