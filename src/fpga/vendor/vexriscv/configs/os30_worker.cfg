# Experimental 64 KiB os30 budget; used only by private resource trials.
# OS30_GEOMETRY_WORKER itself retains the normal 128 KiB CPU data cache.
# Preserve the current CPU ISA, pipeline and predictor configuration.
. "$SCRIPT_DIR/configs/os30.cfg"
DCACHE_SETS=512          # 64 KiB D$: frees RAM for independent geometry work.
