# VexiiRiscv CPU config — MiSTer (DE10-Nano / SuperStation One) target.
#
# Sourced by generate_vexii.sh.  Same base config as the Pocket plus DUAL
# ISSUE (--decoders=2 --lanes=2) for the Cyclone V SE A6 / I7 grade (2.3x
# the ALMs, faster grade than the Pocket's C8).  Issue width is
# microarchitectural: firmware and apps are unchanged.  Late-ALU is a
# deliberate follow-up knob — enable only after STA shows headroom on a
# plain dual-issue build.  Output: VexiiRiscv/VexiiRiscv_mister.v

ICACHE_SETS=256          # 32 KB I$
DCACHE_SETS=1024         # 128 KB D$

EXTRA_FLAGS="--decoders=2 --lanes=2"

# No maxfan annotation: the Pocket hint was A/B-tuned against the A4/C8
# fitter; the A6/I7 netlist starts clean and gets its own pass only if
# STA demands one.
MAXFAN_HINT=0
