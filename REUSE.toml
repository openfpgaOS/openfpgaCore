version = 1

# ---------------------------------------------------------------------------
# Bulk licensing annotations for files that do not carry an inline SPDX header
# (binaries, generated artifacts, data/config, and third-party code whose own
# headers are free-text rather than SPDX).  Source files authored by the
# project carry their own "SPDX-License-Identifier: Apache-2.0" header and are
# NOT listed here.  See LICENSES/ for every referenced license text.
# ---------------------------------------------------------------------------

# ===== Analogue Pocket Framework (APF) — proprietary, Analogue Enterprises ==
[[annotations]]
path = [
    "src/fpga/targets/pocket/apf/**",
    "src/fpga/targets/pocket/core_top.v",
    "src/fpga/targets/pocket/core_bridge_cmd.v",
    "src/fpga/targets/pocket/io_sdram.v",
    "src/fpga/targets/mister/io_sdram.v",
    "src/fpga/targets/pocket/chip32/architectures/chip32.vm.arch",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Analogue Enterprises Limited"
SPDX-License-Identifier = "LicenseRef-Analogue-Pocket-Framework"

# ===== Intel/Altera Quartus megafunction IP (user-generated) ===============
[[annotations]]
path = [
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.v",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.bsf",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.ppf",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.qip",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.sip",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase.spd",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase/**",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase_sim/**",
    "src/fpga/targets/pocket/megafunctions/mf_pllbase_sim.f",
    "src/fpga/targets/pocket/megafunctions/mf_pllram_133.v",
    "src/fpga/targets/pocket/megafunctions/pin_ddio_clk.ppf",
    "src/fpga/targets/pocket/megafunctions/pin_ddio_clk.qip",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 1991-2026 Altera Corporation"
SPDX-License-Identifier = "LicenseRef-Intel-FPGA-IP"

# ===== Analogizer (openFPGA Pocket Analogizer + MiSTer-derived video cores) =
# Vendored upstream GPL — all under targets/pocket/third_party/analogizer/.
# (snac_shifter.v is ThinkElastic Apache-2.0 and was moved OUT to the pocket
# root, so it's no longer under this glob and keeps its own inline header.)
[[annotations]]
path = ["src/fpga/targets/pocket/third_party/analogizer/**"]
precedence = "override"
SPDX-FileCopyrightText = [
    "Copyright (c) 2012-2013 Ludvig Strigeus",
    "Copyright (c) 2017-2018 Sorgelig",
    "Copyright (c) 2024 RndMnkIII (Analogizer)",
]
SPDX-License-Identifier = "GPL-2.0-or-later"


